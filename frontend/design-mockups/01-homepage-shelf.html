<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nooka — 單字書架</title>
<style>
  :root {
    --bg: #E7E1D2;
    --bg-wall-shadow: #D9D2BF;
    --wood: #8B5E34;
    --wood-light: #A5764A;
    --wood-dark: #6B4423;
    --ink: #2A2420;
    --ink-soft: #5C5248;
    --brass: #A9762E;
    --brass-bright: #C68F3D;
    --card-shadow: rgba(42, 36, 32, 0.28);
    --focus-ring: #A9762E;

    --book-travel: #2F6E6B;
    --book-work: #35507A;
    --book-biz: #6B4C6E;
    --book-air: #3E6E8E;
    --book-eng: #6E7A3E;
    --book-sec: #9C4A3C;
    --book-toeic: #B08434;

    --font-display: "Noto Serif TC", "Songti TC", "PMingLiU", "Iowan Old Style", Georgia, serif;
    --font-body: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", "Segoe UI", sans-serif;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1C1A1F;
      --bg-wall-shadow: #100F13;
      --wood: #6B4226;
      --wood-light: #82502E;
      --wood-dark: #3E2716;
      --ink: #EFE6D3;
      --ink-soft: #B8AC97;
      --brass: #D4A73D;
      --brass-bright: #E8C066;
      --card-shadow: rgba(0, 0, 0, 0.55);
      --focus-ring: #E8C066;
    }
  }

  :root[data-theme="dark"] {
    --bg: #1C1A1F;
    --bg-wall-shadow: #100F13;
    --wood: #6B4226;
    --wood-light: #82502E;
    --wood-dark: #3E2716;
    --ink: #EFE6D3;
    --ink-soft: #B8AC97;
    --brass: #D4A73D;
    --brass-bright: #E8C066;
    --card-shadow: rgba(0, 0, 0, 0.55);
    --focus-ring: #E8C066;
  }

  :root[data-theme="light"] {
    --bg: #E7E1D2;
    --bg-wall-shadow: #D9D2BF;
    --wood: #8B5E34;
    --wood-light: #A5764A;
    --wood-dark: #6B4423;
    --ink: #2A2420;
    --ink-soft: #5C5248;
    --brass: #A9762E;
    --brass-bright: #C68F3D;
    --card-shadow: rgba(42, 36, 32, 0.28);
    --focus-ring: #A9762E;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: var(--font-body);
    color: var(--ink);
    background:
      radial-gradient(ellipse 900px 500px at 78% -10%, color-mix(in srgb, var(--brass) 16%, transparent), transparent 60%),
      var(--bg);
    min-height: 100vh;
    overflow-x: hidden;
  }

  .page {
    max-width: 960px;
    margin: 0 auto;
    padding: 2.5rem 1.5rem 5rem;
  }

  .topbar {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 1rem;
    padding-bottom: 2.25rem;
    border-bottom: 1px solid color-mix(in srgb, var(--ink) 12%, transparent);
  }

  .wordmark {
    font-family: var(--font-display);
    font-size: 1.6rem;
    font-weight: 600;
    letter-spacing: 0.04em;
    color: var(--ink);
  }

  .auth-nav {
    display: flex;
    align-items: center;
    gap: 1.25rem;
    font-size: 0.9rem;
  }

  .ghost-link {
    color: var(--ink-soft);
    text-decoration: none;
  }
  .ghost-link:hover { color: var(--ink); }

  .brass-link {
    color: var(--bg);
    background: var(--brass);
    padding: 0.5rem 1.1rem;
    border-radius: 3px;
    text-decoration: none;
    font-weight: 600;
    transition: background-color 0.15s ease;
  }
  .brass-link:hover { background: var(--brass-bright); }

  a:focus-visible, .book:focus-visible {
    outline: 2px solid var(--focus-ring);
    outline-offset: 3px;
  }

  .intro {
    padding: 3rem 0 2.5rem;
  }

  .eyebrow {
    margin: 0 0 0.6rem;
    font-size: 0.78rem;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--brass);
    font-weight: 700;
  }

  .intro h1 {
    margin: 0;
    font-family: var(--font-display);
    font-weight: 600;
    font-size: clamp(1.7rem, 3.4vw, 2.5rem);
    line-height: 1.35;
    max-width: 24ch;
    text-wrap: balance;
    color: var(--ink);
  }

  .shelf-unit {
    display: flex;
    flex-direction: column;
    gap: 3.25rem;
  }

  .shelf-row {
    position: relative;
  }

  .books {
    display: flex;
    align-items: flex-end;
    flex-wrap: wrap;
    gap: 0.9rem;
    padding: 0 0.75rem;
    position: relative;
    z-index: 2;
  }

  .book {
    --book-color: var(--book-travel);
    display: flex;
    align-items: center;
    justify-content: center;
    width: 62px;
    text-decoration: none;
    border-radius: 3px 3px 2px 2px;
    background:
      linear-gradient(90deg,
        color-mix(in srgb, var(--book-color) 70%, black) 0%,
        var(--book-color) 12%,
        var(--book-color) 88%,
        color-mix(in srgb, var(--book-color) 70%, black) 100%);
    box-shadow:
      inset 0 0 0 1px color-mix(in srgb, black 25%, transparent),
      0 10px 16px -8px var(--card-shadow);
    position: relative;
    transform-origin: bottom center;
    transition: transform 0.22s cubic-bezier(.2,.7,.3,1), box-shadow 0.22s ease;
    animation: bookRise 0.5s cubic-bezier(.2,.7,.3,1) both;
  }

  .book::before,
  .book::after {
    content: "";
    position: absolute;
    left: 6px;
    right: 6px;
    height: 2px;
    background: color-mix(in srgb, var(--brass) 70%, white 10%);
    opacity: 0.55;
  }
  .book::before { top: 14px; }
  .book::after { bottom: 14px; }

  .book:hover, .book:focus-visible {
    transform: translateY(-16px) rotate(-2.5deg);
    box-shadow:
      inset 0 0 0 1px color-mix(in srgb, black 25%, transparent),
      6px 22px 20px -10px var(--card-shadow);
  }

  .book-label {
    writing-mode: vertical-rl;
    text-orientation: mixed;
    font-family: var(--font-display);
    color: color-mix(in srgb, white 92%, var(--book-color));
    font-size: 1.05rem;
    font-weight: 600;
    letter-spacing: 0.14em;
    text-shadow: 0 1px 1px rgba(0,0,0,0.35);
  }

  .book--travel { --book-color: var(--book-travel); height: 208px; }
  .book--work   { --book-color: var(--book-work);   height: 232px; width: 56px; }
  .book--biz    { --book-color: var(--book-biz);    height: 196px; width: 70px; }
  .book--air    { --book-color: var(--book-air);    height: 224px; width: 52px; }
  .book--eng    { --book-color: var(--book-eng);    height: 212px; width: 66px; }
  .book--sec    { --book-color: var(--book-sec);    height: 200px; width: 58px; }
  .book--toeic  { --book-color: var(--book-toeic);  height: 236px; width: 74px; }

  .books .book:nth-child(1) { animation-delay: 0.02s; }
  .books .book:nth-child(2) { animation-delay: 0.07s; }
  .books .book:nth-child(3) { animation-delay: 0.12s; }
  .books .book:nth-child(4) { animation-delay: 0.17s; }

  @keyframes bookRise {
    from { transform: translateY(26px); opacity: 0; }
    to   { transform: translateY(0); opacity: 1; }
  }

  .shelf-board {
    height: 22px;
    margin-top: -2px;
    border-radius: 2px;
    background: linear-gradient(180deg, var(--wood-light) 0%, var(--wood) 55%, var(--wood-dark) 100%);
    box-shadow:
      0 14px 18px -10px rgba(0,0,0,0.35),
      inset 0 1px 0 color-mix(in srgb, white 18%, transparent);
    position: relative;
    z-index: 1;
  }

  .shelf-board::after {
    content: "";
    position: absolute;
    inset: 0;
    background: repeating-linear-gradient(
      90deg,
      transparent 0 40px,
      color-mix(in srgb, black 8%, transparent) 40px 41px
    );
    opacity: 0.5;
    border-radius: inherit;
  }

  footer {
    margin-top: 3.5rem;
    text-align: center;
    font-size: 0.82rem;
    color: var(--ink-soft);
  }

  @media (prefers-reduced-motion: reduce) {
    .book { animation: none; transition: none; }
    .book:hover, .book:focus-visible { transform: none; }
  }

  @media (max-width: 560px) {
    .topbar { flex-direction: column; align-items: flex-start; gap: 0.75rem; }
  }
</style>
</head>
<body>

<div class="page">
  <header class="topbar">
    <div class="wordmark">Nooka</div>
    <nav class="auth-nav">
      <a class="ghost-link" href="#">登入</a>
      <a class="brass-link" href="#">註冊</a>
    </nav>
  </header>

  <section class="intro">
    <p class="eyebrow">單字書架</p>
    <h1>挑一本書,開始今天的複習</h1>
  </section>

  <section class="shelf-unit" aria-label="分類書架">
    <div class="shelf-row">
      <div class="books">
        <a class="book book--travel" href="#" aria-label="旅遊分類">
          <span class="book-label">旅遊</span>
        </a>
        <a class="book book--work" href="#" aria-label="工作分類">
          <span class="book-label">工作</span>
        </a>
        <a class="book book--biz" href="#" aria-label="商務分類">
          <span class="book-label">商務</span>
        </a>
        <a class="book book--air" href="#" aria-label="航空用分類">
          <span class="book-label">航空用</span>
        </a>
      </div>
      <div class="shelf-board"></div>
    </div>

    <div class="shelf-row">
      <div class="books">
        <a class="book book--eng" href="#" aria-label="工程用分類">
          <span class="book-label">工程用</span>
        </a>
        <a class="book book--sec" href="#" aria-label="資安用分類">
          <span class="book-label">資安用</span>
        </a>
        <a class="book book--toeic" href="#" aria-label="多益用分類">
          <span class="book-label">多益用</span>
        </a>
      </div>
      <div class="shelf-board"></div>
    </div>
  </section>

  <footer>點選書本進入該分類的單字列表</footer>
</div>

</body>
</html>
